micronaut:
  application:
    name: login
  server:
    http-to-https-redirect: true
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - '^https://([a-zA-Z0-9-]+\.)?trevorism\.com$'
          allowed-methods:
            - GET
            - POST
            - OPTIONS
          allowed-headers:
            - Content-Type
          allow-credentials: true
          max-age: 1800
  security:
    enabled: true
    redirect:
      enabled: false
  router:
    static-resources:
      default:
        enabled: true
        mapping: /**
        paths: classpath:public
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
netty:
  default:
    allocator:
      max-order: 3
